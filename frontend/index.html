<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="BoardingHub — nền tảng quản lý nhà trọ: phòng, hợp đồng, điện nước, hóa đơn, công nợ và quyết toán cọc." />
    <title>BoardingHub — Quản lý nhà trọ thông minh</title>
    <script>
      try {
        const t = localStorage.getItem("bh-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
