services:
 mysql:
  image: mysql:8.4
  container_name: boardinghub-mysql
  environment:
   MYSQL_DATABASE: boardinghub
   MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-localpassword}
  ports: ["3306:3306"]
  volumes: ["mysql_data:/var/lib/mysql"]
  healthcheck:
   test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-localpassword}"]
   interval: 10s
   timeout: 5s
   retries: 10
 backend:
  build: .
  container_name: boardinghub-api
  depends_on:
   mysql: {condition: service_healthy}
  environment:
   SPRING_PROFILES_ACTIVE: prod
   DB_URL: jdbc:mysql://mysql:3306/boardinghub?serverTimezone=Asia/Ho_Chi_Minh
   DB_USERNAME: root
   DB_PASSWORD: ${DB_PASSWORD:-localpassword}
   JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-production-secret-at-least-32-chars}
  ports: ["8080:8080"]
volumes: {mysql_data:}
