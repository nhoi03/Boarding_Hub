spring:
 application:
  name: boardinghub-backend
 profiles:
  active: ${SPRING_PROFILES_ACTIVE:local}
 jpa:
  open-in-view: false
  hibernate:
   ddl-auto: validate
  properties:
   hibernate:
    format_sql: true
 flyway:
  enabled: true
  locations: classpath:db/migration
server:
 port: ${SERVER_PORT:8080}
management:
 endpoints:
  web:
   exposure:
    include: health,info
app:
 jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-this-before-production-0123456789}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
