services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: boardinghub
      POSTGRES_USER: boardinghub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-boardinghub_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - boardinghub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardinghub"]
      interval: 5s
      retries: 10
volumes:
  boardinghub_pg:
